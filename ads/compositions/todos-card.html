<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../shared/brand.css">
<script src="../shared/gsap.min.js"></script>
<script src="../shared/ad.js"></script>
</head>
<body>
<!-- The Todos card from the site, 380 x 215 at 2x. A seamless 10 s loop. -->
<div id="root" class="card-only" data-composition-id="todos-card" data-start="0" data-duration="10" data-width="760" data-height="430" style="width:760px;height:430px">
  <div class="c screen" style="height:215px">
    <div class="row">
      <span class="box"><span class="fillbox"></span><span data-icon="check"></span></span>
      <span class="name muted">Renew OR/CR<span class="strike"></span></span>
    </div>
    <div class="row" id="rent">
      <span class="hl"></span>
      <span class="box" id="rent-box"><span class="fillbox" style="transform:scale(0)"></span><span data-icon="check" style="opacity:0"></span></span>
      <span class="name" id="rent-name">Send rent to Ate<span class="strike" style="transform:scaleX(0)"></span></span>
      <span class="pill pill--watch" id="rent-pill">Today</span>
    </div>
    <div class="row" id="rice">
      <span class="hl"></span>
      <span class="box"></span>
      <span class="name">Buy rice, 5 kg</span>
      <span class="pill pill--plain" id="rice-pill" style="opacity:0">Tomorrow</span>
    </div>
    <div class="row"><span class="box"></span><span class="name">Pay Meralco</span><span class="pill pill--plain">Fri</span></div>

    <div class="banner banner--top" id="notif"><span data-icon="bell"></span><span>Send rent to Ate<small>Due today, 5:00 PM</small></span></div>
    <div class="banner banner--bottom" id="toast"><span data-icon="bell"></span>Reminder set for tomorrow, 9:00 AM</div>
    <div class="tap"></div>
  </div>
</div>

<script>
  const A = Ad('todos-card');
  window.__timelines = window.__timelines || {};
  window.__timelines['todos-card'] = A.tl;
  const { tl } = A;

  // 5:00 PM: the reminder drops in over the list.
  tl.fromTo('#notif', { yPercent: -170 }, { yPercent: 0, duration: 0.6, ease: 'back.out(1.4)' }, 0.6);
  tl.to('#notif', { yPercent: -170, duration: 0.4, ease: 'power3.in' }, 2.1);

  // Rent gets checked off.
  tl.to('#rent .hl', { opacity: 1, duration: 0.2 }, 2.6);
  A.tapOn('#rent-box', 2.65);
  tl.to('#rent-box .fillbox', { scale: 1, duration: 0.25, ease: 'back.out(2)' }, 2.8);
  tl.to('#rent-box [data-icon]', { opacity: 1, duration: 0.15 }, 2.95);
  tl.to('#rent-name .strike', { scaleX: 1, duration: 0.35, ease: 'power2.out' }, 3.0);
  tl.to('#rent-name', { color: 'rgb(90 85 120)', duration: 0.3 }, 3.05);
  tl.to('#rent-pill', { scale: 0.5, opacity: 0, duration: 0.25 }, 3.15);
  tl.to('#rent .hl', { opacity: 0, duration: 0.4 }, 3.5);

  // Rice gets a reminder for tomorrow.
  tl.to('#rice .hl', { opacity: 1, duration: 0.2 }, 4.4);
  A.tapOn('#rice .name', 4.45);
  tl.fromTo('#rice-pill', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, 4.65);
  tl.to('#rice .hl', { opacity: 0, duration: 0.4 }, 5.1);
  tl.fromTo('#toast', { yPercent: 170 }, { yPercent: 0, duration: 0.5, ease: 'back.out(1.4)' }, 5.0);
  tl.to('#toast', { yPercent: 170, duration: 0.4, ease: 'power2.in' }, 7.2);

  // A new day: back to how it began, so the loop has no seam.
  tl.to('#rent-box .fillbox', { scale: 0, duration: 0.3 }, 8.4);
  tl.to('#rent-box [data-icon]', { opacity: 0, duration: 0.2 }, 8.4);
  tl.to('#rent-name .strike', { scaleX: 0, duration: 0.3, transformOrigin: '100% 50%' }, 8.4);
  tl.to('#rent-name', { color: 'rgb(30 27 58)', duration: 0.3 }, 8.5);
  tl.to('#rent-pill', { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, 8.6);
  tl.to('#rice-pill', { scale: 0.5, opacity: 0, duration: 0.25 }, 8.5);
  tl.set('#rent-name .strike', { transformOrigin: '0% 50%' }, 9.9);
</script>
</body>
</html>
